[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-relinker"
version = "0.1.0"
description = "Batch manipulation of internal links across static HTML sites and WordPress installations"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
wordpress = ["PyMySQL>=1.1,<2"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "lxml-stubs>=0.5",
]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
